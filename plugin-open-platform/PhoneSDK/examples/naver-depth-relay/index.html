<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:18767; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>네이버 안내 로컬 중계</title><link rel="stylesheet" href="style.css"></head><body><main>
<h1>네이버 안내 로컬 중계</h1><p>공식 MemoMind 앱의 글라스 연결을 사용합니다.</p>
<label>연결 코드<input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="APK에서 복사한 연결 코드 붙여넣기"></label>
<button id="connect">연결하고 이미지 전송</button><button id="stop">전송 중지</button>
<p id="status" role="status">앱 초기화 중</p><p id="detail"></p><p id="metrics"></p>
<p>휴대폰의 ‘네이버 입체 길안내’에서 중계를 시작하고 연결 코드를 복사하세요. 이 플러그인에 붙여넣고 연결하면 실제 네이버 알림 이미지가 표시됩니다.</p>
<p>외부 서버를 사용하지 않습니다. 연결 코드는 이 플러그인의 비공개 저장소에 저장됩니다.</p>
</main><script type="module" src="plugin.js"></script></body></html>
