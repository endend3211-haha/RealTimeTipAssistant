<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:18769 ws://127.0.0.1:*; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><title>Memo One Messenger</title><link rel="stylesheet" href="style.css"><script type="module" src="plugin.js"></script></head><body><main><header><small>MEMO ONE / MESSENGER</small><h1>메신저</h1><p>메시지는 한눈에, 답장은 목소리로.</p><span id="connection" class="pill">연결 대기</span></header><section class="card"><div class="heading"><h2>받은 메시지</h2><span id="count">0</span></div><p id="empty">보조 앱을 연결하면 메시지가 표시됩니다.</p><div id="inbox"></div></section><section class="card" id="reader" hidden><div class="identity"><span id="badge" class="icon"></span><div><strong id="sender"></strong><small id="appName"></small></div></div><p id="body"></p><div class="buttons"><button id="voice" class="primary">음성으로 답장</button><button id="other">다른 메시지</button></div><div id="replyBox" hidden><label for="draft">보낼 답장</label><textarea id="draft" rows="3" maxlength="500"></textarea><div class="buttons"><button id="send" class="primary">확인 후 전송</button><button id="cancel">취소</button></div></div></section><p id="status" role="status">연결 준비 중</p><details id="setup"><summary>고급 연결 설정</summary><p>기본은 자동 연결입니다. 수동 연결이 필요할 때만 보조 앱의 연결 코드를 입력하세요.</p><label for="token">연결 코드</label><input id="token" type="password" autocomplete="off"><button id="connect" class="primary">연결</button><p>같은 휴대폰 안에서만 통신합니다.</p></details></main></body></html>
