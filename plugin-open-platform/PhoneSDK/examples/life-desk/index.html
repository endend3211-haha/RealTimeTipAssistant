<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110e">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://www.gdacs.org; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Glow OS · 기기 콘솔</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="console">
    <header class="console-head">
      <div class="logo">◌</div>
      <div><p>GM 기기 시스템</p><h1>Glow OS</h1></div>
      <div class="device-state" id="deviceState"><i></i><span>연결 중</span></div>
    </header>
    <section class="device-first">
      <p class="eyebrow">기기 우선 경험</p>
      <h2>오른쪽 글라스 화면을 사용하세요</h2>
      <p>폰 페이지에서 설정하고, 전체 데스크톱과 앱은 기기에서 실행됩니다.</p>
      <button class="primary" id="wakeDevice" type="button">기기 데스크톱 깨우기</button>
    </section>
    <section class="guide-card">
      <div class="section-title"><span>기기 제스처</span><small>Studio에서 직접 시뮬레이션</small></div>
      <div class="gesture-grid">
        <div><b>← →</b><span>왼쪽 / 오른쪽 선택</span></div>
        <div><b>↑ ↓</b><span>행 / 페이지 이동</span></div>
        <div><b>Click</b><span>확인 / 열기</span></div>
        <div><b>Double</b><span>홈으로 돌아가기</span></div>
        <div><b>Hold</b><span>빠른 동작</span></div>
      </div>
    </section>
    <section class="settings-card">
      <div class="section-title"><span>기기 설정</span><small id="saveState">자동 저장</small></div>
      <form id="cityForm">
        <label for="cityInput">날씨 도시</label>
        <div class="input-row"><input id="cityInput" value="Shanghai" maxlength="40"><button type="submit">업데이트</button></div>
      </form>
      <label for="memoInput">글라스 메모</label>
      <textarea id="memoInput" maxlength="240" rows="5" placeholder="글라스에서 볼 내용을 입력하세요…"></textarea>
    </section>
    <section class="screen-status">
      <span>현재 기기 페이지</span><strong id="screenName">홈</strong><small id="dataState">날씨 및 태풍 데이터 불러오는 중</small>
    </section>
    <canvas id="deviceCanvas" width="600" height="350" aria-hidden="true"></canvas>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script type="module" src="./plugin.js"></script>
</body>
</html>
