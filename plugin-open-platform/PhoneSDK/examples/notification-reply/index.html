<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notification Reply</title><link rel="stylesheet" href="style.css"><script type="module" src="plugin.js"></script></head>
<body><main><h1>알림 안경 답장</h1><p class="hint">Studio에서 알림을 입력하고 안경 표시와 음성 답장을 테스트합니다.</p>
<section><label>앱<select id="app"><option>문자</option><option>카카오톡</option><option>WeChat</option></select></label><label>발신자<input id="sender" value="김철수"></label><label>메시지<textarea id="message">오늘 회의 몇 시야?</textarea></label><button id="notify">안경에 알림 표시</button></section>
<section><h2>답장</h2><button id="choose">답장하기</button><button id="voice" disabled>🎙 안경 음성 입력</button><input id="reply" placeholder="음성 인식 결과 또는 Studio 입력" disabled><button id="send" disabled>최종 보내기</button><p id="status">초기화 중…</p></section><pre id="log"></pre></main></body></html>
