<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><title>R08 Health</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><strong><span class="ring"></span>R08 Health</strong><select id="language" aria-label="언어 선택"><option value="ko">한국어</option><option value="en">English</option></select></header>
<section class="intro"><h1 id="title">나의 건강, 한눈에.</h1><p id="description"></p></section>
<section class="connection"><span id="status" role="status"></span><p id="updated"></p><div class="actions"><button id="query" disabled></button><button id="send" disabled></button></div><p id="feedback" role="status"></p></section>
<section class="connection"><label for="healthFile" id="importLabel"></label> <input type="file" id="healthFile" accept=".json,application/json"></section><div class="period"><label id="dateLabel" for="date"></label><input id="date" type="date"></div>
<section id="metrics" class="metrics" aria-label="건강 정보"></section>
<section class="history"><h2 id="historyTitle"></h2><div id="history"></div></section>
<section class="history"><h2 id="btTitle"></h2><p id="btNote"></p><div class="actions bt-actions"><button id="btCheck">API 확인</button><button id="btSelect" disabled>링 선택</button><button id="btRead" disabled>배터리 읽기</button><button id="btDisconnect" disabled>연결 해제</button></div><pre id="btLog" role="log" aria-live="polite"></pre></section><footer id="note"></footer></main><script type="module" src="plugin.js"></script></body></html>
