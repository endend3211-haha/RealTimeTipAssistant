<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포켓 만화</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>POCKET</span><h1>포켓 만화</h1><p>표지 덱에서 고르고, 안경 전체 화면으로 읽으세요.</p></header>
<section id="catalog-tools"><form id="search"><input id="query" placeholder="만화 제목 검색" aria-label="만화 제목"><select id="language" aria-label="번역 언어"><option value="ko">한국어</option><option value="en">영어</option><option value="ja">일본어</option></select><button>검색</button></form><div class="row"><button id="previous-list">이전 7개</button><span id="page"></span><button id="next-list">다음 7개</button></div></section>
<section class="display"><canvas id="screen" width="600" height="350" aria-label="안경 표시 확인 화면"></canvas><div id="metrics">안경 연결 대기</div></section><div id="deck-tools"><p id="focused"></p><div class="row"><button id="left">← 이전 작품</button><button id="read" disabled>선택한 만화 읽기</button><button id="right">다음 작품 →</button></div></div>
<section id="reader-tools" hidden><h2 id="reader-title"></h2><div class="row"><button id="previous-page">이전 페이지</button><button id="next-page">다음 미독 페이지</button><button id="back">작품 목록</button><button id="more-chapters">회차 더 불러오기</button></div><p id="credit"></p></section>
<p id="status" role="status"></p><details><summary>연결 및 성능 설정</summary><p>가입 없는 무료 공용 중계 서버가 기본 설정되어 있습니다. PC 없이 통신사망에서 사용합니다. 무료 서비스의 요청량·이미지 크기 제한이 있습니다.</p><input id="gateway" placeholder="https://proxy.cors.dev" aria-label="중계 서버"><button id="save-gateway">연결</button><p>전환 중에도 선명도 유지 · 수신 완료에 맞춘 부드러운 이동</p><button id="demo">오프라인 예제 7개로 동작 확인</button></details><footer>목록: 1번 다음 · 2번 이전 · 길게 선택 / 읽기: 1번 다음 미독 · 2번 이전 · 길게 목록</footer></main><script type="module" src="plugin.js"></script></body></html>
