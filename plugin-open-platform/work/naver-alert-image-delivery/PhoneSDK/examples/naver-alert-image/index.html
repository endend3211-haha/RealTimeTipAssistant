<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>네이버 알림 이미지 안내</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>네이버 알림 이미지 안내</h1><p>지도 알림 → 폰 이미지 → 글라스 · 외부 서버 없음</p><p id="host">실제 알림: Android 호스트 연결 대기</p><canvas id="preview" width="560" height="272" aria-label="글라스 안내 이미지"></canvas><p id="status" role="status">안내 대기</p><p id="metrics">560×272 · GRAY4 · 76,160 B</p><button id="connect">글라스 전송 켜기</button><button id="stop">전송 끄기</button><button id="retry">다시 보내기</button><button id="save">PNG 저장</button><h2>알림 테스트</h2><p>아래 입력은 실제 네이버 지도 알림이 아닙니다.</p><textarea id="input" rows="3">300m 앞 우회전</textarea><button id="test">테스트 이미지 만들기</button><p>알림에 없는 차선·도로 형태는 만들지 않습니다. 여러 방향이 섞이면 원문을 표시합니다. 알림은 60초 후 만료됩니다.</p></main><script type="module" src="plugin.mjs"></script></body></html>
